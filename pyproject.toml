[project]
name = "macwatch"
version = "0.1.0"
description = "Hlídač bazarů s použitými MacBooky, posouzení ceny a upozornění na Discord"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macwatch*"]

[tool.setuptools.package-data]
"macwatch.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
